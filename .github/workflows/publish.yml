# Publishes @npv12/opencode-context-sidebar to npm whenever a GitHub release is published.
#
# Auth: npm Trusted Publishing (OIDC). One-time setup on npmjs.com:
#   Package settings → Trusted Publisher →
#     owner: npv12, repository: opencode-context-sidebar, workflow: publish.yml
#
# With that configured this workflow needs NO npm token secret; provenance
# attestations are generated automatically. Fallback (if you prefer tokens):
#   add an NPM_TOKEN repository secret and set it as NODE_AUTH_TOKEN on the
#   publish step below, then remove the id-token permission.
#
# The release tag must match package.json's version ("v" prefix optional).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm (OIDC publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Typecheck and test
        run: bun run check

      - name: Build
        run: bun run build

      - name: Verify tarball contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
